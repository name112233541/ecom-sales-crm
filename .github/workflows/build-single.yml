name: build-single

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node build-single.mjs
      - name: Commit standalone file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add single.html
          if git diff --cached --quiet; then
            echo "single.html already up to date"
          else
            git commit -m "build: regenerate single-file app"
            git push
          fi
